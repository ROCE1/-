<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LY App</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="stylesheet" href="./style.css?v=0.8.1" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-main">
        <span class="date" id="today-date">—</span>
        <button class="status-pill" id="busy-toggle" type="button">空闲</button>
      </div>
      <div class="topbar-sub" id="today-summary">—</div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar">
      <button class="tab active" data-tab="today">今日</button>
      <button class="tab" data-tab="fitness">健身</button>
      <button class="tab" data-tab="calendar">日历</button>
      <button class="tab" data-tab="records">记录</button>
      <button class="tab" data-tab="stats">统计</button>
      <button class="tab" data-tab="settings">设置</button>
    </nav>

    <button class="fab" id="add-task" type="button" aria-label="新建">＋</button>

    <dialog id="task-dialog" class="sheet">
      <form method="dialog" id="task-form">
        <h2 id="dialog-title">新建任务</h2>

        <label class="field">
          <span>标题</span>
          <input name="title" required maxlength="80" placeholder="比如：写完方案" />
        </label>

        <label class="field">
          <span>类型</span>
          <select name="type" id="task-type">
            <option value="urgent">紧急</option>
            <option value="side">支线</option>
            <option value="daily">日常</option>
            <option value="main">主线</option>
          </select>
        </label>

        <div class="hint" id="task-always-on-hint" hidden>
          主线 / 日常是常挂任务：每天出现在今日列表，不需要设置重复、倒计时和提醒。
        </div>

        <label class="field" data-adv="1">
          <span>重复</span>
          <select name="repeatKind" id="repeat-kind">
            <option value="once">仅一次</option>
            <option value="daily">每天（常挂）</option>
            <option value="weekly">每周</option>
            <option value="everyN">每 N 天</option>
          </select>
        </label>

        <label class="field" data-repeat="once" data-adv="1">
          <span>日期</span>
          <input type="date" name="onceDate" />
        </label>

        <label class="field" data-repeat="weekly" data-adv="1" hidden>
          <span>星期（可多选）</span>
          <select name="weeklyDays" multiple size="3">
            <option value="1">周一</option>
            <option value="2">周二</option>
            <option value="3">周三</option>
            <option value="4">周四</option>
            <option value="5">周五</option>
            <option value="6">周六</option>
            <option value="0">周日</option>
          </select>
        </label>

        <label class="field" data-repeat="everyN" data-adv="1" hidden>
          <span>间隔天数</span>
          <input type="number" name="everyN" min="1" value="3" />
        </label>

        <label class="field" data-adv="1">
          <span>截止时间（留空 = 不倒计时）</span>
          <input type="datetime-local" name="deadline" />
        </label>

        <label class="field" data-adv="1">
          <span>提前提醒（分钟，留空用全局默认）</span>
          <input type="number" name="leadMinutes" min="0" max="10080" inputmode="numeric" placeholder="15" />
        </label>

        <label class="field row" data-adv="1">
          <span>强提醒（横幅 + 倒计时 + 震动）</span>
          <input type="checkbox" name="strong" />
        </label>

        <label class="field">
          <span>备注</span>
          <textarea name="notes" rows="2" maxlength="500"></textarea>
        </label>

        <div class="dialog-actions">
          <button type="button" class="ghost" id="cancel-task">取消</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="fitness-dialog" class="sheet">
      <form method="dialog" id="fitness-form">
        <h2 id="fitness-dialog-title">新建健身项</h2>

        <label class="field">
          <span>内容</span>
          <input name="name" required maxlength="60" placeholder="卧推 / 跑步" />
        </label>

        <label class="field">
          <span>属于哪一天</span>
          <select name="day" id="fitness-day">
            <option value="strength">力量日（组 × 个）</option>
            <option value="cardio">有氧日（时长 / 距离）</option>
          </select>
        </label>

        <div class="field-row" data-fday="strength">
          <label class="field">
            <span>组数</span>
            <input type="number" name="sets" min="1" max="99" inputmode="numeric" placeholder="4" />
          </label>
          <label class="field">
            <span>每组个数</span>
            <input type="number" name="reps" min="1" max="999" inputmode="numeric" placeholder="8" />
          </label>
        </div>

        <div class="field-row" data-fday="cardio" hidden>
          <label class="field">
            <span>时长（分钟）</span>
            <input type="number" name="minutes" min="1" max="999" inputmode="numeric" placeholder="30" />
          </label>
          <label class="field">
            <span>距离（km，可空）</span>
            <input type="number" name="km" min="0" max="999" step="0.1" inputmode="decimal" placeholder="5" />
          </label>
        </div>

        <label class="field">
          <span>重复</span>
          <select name="repeatKind" id="fitness-repeat-kind">
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="everyN">每 N 天</option>
            <option value="once">仅一次</option>
          </select>
        </label>

        <label class="field" data-frepeat="once" hidden>
          <span>日期</span>
          <input type="date" name="onceDate" />
        </label>

        <label class="field" data-frepeat="weekly" hidden>
          <span>星期（可多选）</span>
          <select name="weeklyDays" multiple size="3">
            <option value="1">周一</option>
            <option value="2">周二</option>
            <option value="3">周三</option>
            <option value="4">周四</option>
            <option value="5">周五</option>
            <option value="6">周六</option>
            <option value="0">周日</option>
          </select>
        </label>

        <label class="field" data-frepeat="everyN" hidden>
          <span>间隔天数</span>
          <input type="number" name="everyN" min="1" value="2" />
        </label>

        <div class="dialog-actions">
          <button type="button" class="ghost" id="cancel-fitness">取消</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="summary-dialog" class="sheet">
      <form method="dialog" id="summary-form">
        <h2 id="summary-title">今日总结</h2>
        <div class="muted" id="summary-done">—</div>
        <label class="field">
          <span>工作总结</span>
          <textarea name="summary" rows="4" placeholder="今天做了什么、卡在哪、明天要避开什么"></textarea>
        </label>
        <label class="field">
          <span>明日计划</span>
          <textarea name="plan" rows="3" placeholder="明天最重要的 1–3 件事"></textarea>
        </label>
        <div class="dialog-actions">
          <button type="button" class="ghost" id="summary-later">稍后再说</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="card-dialog" class="sheet">
      <form method="dialog" id="card-form">
        <h2 id="card-dialog-title">新记录卡</h2>
        <label class="field">
          <span>标题（可空）</span>
          <input name="title" maxlength="60" />
        </label>
        <label class="field">
          <span>内容</span>
          <textarea name="body" rows="6" required maxlength="4000" placeholder="心得、灵感、摘抄……"></textarea>
        </label>
        <label class="field">
          <span>标签（逗号分隔，可空）</span>
          <input name="tags" maxlength="80" />
        </label>
        <div class="dialog-actions">
          <button type="button" class="ghost" id="card-cancel">取消</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./app.js?v=0.8.1"></script>
  </body>
</html>
