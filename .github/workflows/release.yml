name: release

# 推送 v* 标签就触发：在 GitHub 的 runner 上打包并发布。
# 这样不需要任何人把 118 MB 的安装包从家里网络传上去。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # pnpm 在 CI 上不一定执行 electron 的安装脚本；没有 dist 就没法打包，
      # 这里兜底跑一次它的安装器（runner 访问 GitHub 是内网速度）。
      - name: 确保 Electron 运行时存在
        shell: pwsh
        run: |
          if (!(Test-Path node_modules/electron/dist/electron.exe)) {
            Write-Host "electron dist 缺失，执行安装器"
            node node_modules/electron/install.js
          } else {
            Write-Host "electron dist 已存在"
          }
          Get-ChildItem node_modules/electron/dist/electron.exe | Select-Object FullName, Length

      - name: 生成图标
        run: python scripts/make-icons.py
        continue-on-error: true

      - name: 打包 Windows 安装包
        shell: pwsh
        run: |
          pnpm build:win 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: 生成更新清单
        run: node scripts/make-latest-yml.mjs

      - name: 发布（自动创建 Release 并上传资产）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: false

      # 失败时把日志提交回仓库：本机访问不了 GitHub 的日志接口，
      # 但 raw.githubusercontent.com 经过加速前缀是能读的。
      - name: 失败诊断（提交日志到仓库）
        if: failure()
        shell: pwsh
        run: |
          $lines = @()
          $lines += "run: $env:GITHUB_RUN_ID"
          $lines += "node: $(node -v)"
          $lines += "pnpm: $(pnpm -v)"
          if (Test-Path build.log) { $lines += (Get-Content build.log -Tail 120) } else { $lines += "no build.log" }
          if (Test-Path node_modules/electron/dist) { $lines += "electron dist exists" } else { $lines += "electron dist MISSING" }
          $lines | Out-File -FilePath ci-failure.log -Encoding utf8
          git config user.name "ci-bot"
          git config user.email "ci-bot@local"
          git add -f ci-failure.log
          git commit -m "ci: 记录失败日志" 2>$null
          git push origin HEAD:main
