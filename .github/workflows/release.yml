name: release

# 推送 v* 标签就触发：在 GitHub 的 runner 上打包并发布。
# 这样不需要任何人把 118 MB 的安装包从家里网络传上去。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 没配安卓签名密钥时跳过 APK 步骤，只发桌面安装包
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile *> install.log
          $code = $LASTEXITCODE
          Get-Content install.log -Tail 30
          exit $code

      # pnpm 在 CI 上不一定执行 electron 的安装脚本；没有 dist 就没法打包，
      # 这里兜底跑一次它的安装器（runner 访问 GitHub 是内网速度）。
      - name: 确保 Electron 运行时存在
        shell: pwsh
        run: |
          if (!(Test-Path node_modules/electron/dist/electron.exe)) {
            Write-Host "electron dist 缺失，执行安装器"
            node node_modules/electron/install.js *> electron.log
            $code = $LASTEXITCODE
            Get-Content electron.log -Tail 20
            if ($code -ne 0) { exit $code }
          } else {
            Write-Host "electron dist 已存在"
          }

      - name: 生成图标
        run: python scripts/make-icons.py
        continue-on-error: true

      - name: 打包 Windows 安装包
        shell: pwsh
        run: |
          pnpm build:win *> build.log
          $code = $LASTEXITCODE
          "===== EXITCODE=$code =====" | Out-File -FilePath build.log -Append
          Get-Content build.log -Tail 40
          exit $code

      - name: 生成更新清单
        shell: pwsh
        run: |
          node scripts/make-latest-yml.mjs *> manifest.log
          $code = $LASTEXITCODE
          Get-Content manifest.log -Tail 20
          exit $code

      # ---------- 安卓（有签名密钥时才跑） ----------
      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: 写入安卓签名密钥
        if: env.HAS_KEYSTORE == 'true'
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          $jks = Join-Path $PWD 'android/release.jks'
          [IO.File]::WriteAllBytes($jks, $bytes)
          # Gradle 的 file() 会按模块目录解析相对路径，反斜杠路径会被拼坏，
          # 所以这里统一写成正斜杠的绝对路径。
          $jksPath = $jks.Replace('\', '/')
          @"
          storeFile=$jksPath
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          "@ | Out-File -FilePath android\keystore.properties -Encoding utf8

      - name: 打包安卓 APK
        if: env.HAS_KEYSTORE == 'true'
        shell: pwsh
        run: |
          node scripts/write-web-version.mjs
          npx cap sync android *> android-sync.log
          cd android
          .\gradlew.bat assembleRelease --no-daemon *> ..\android.log
          $code = $LASTEXITCODE
          Get-Content ..\android.log -Tail 30
          if ($code -ne 0) { exit $code }
          $version = (Get-Content ..\package.json -Raw | ConvertFrom-Json).version
          Copy-Item app/build/outputs/apk/release/app-release.apk "..\release\DSH-App-$version-release.apk"

      # ---------- 发布 ----------
      - name: 发布（gh CLI 直接创建 Release 并上传）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "step started" | Out-File -FilePath release.log -Encoding utf8
          try {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "v$version"
            $files = @()
            $files += (Get-ChildItem release/*.exe | ForEach-Object { $_.FullName })
            $files += (Resolve-Path release/latest.yml).Path
            $files += (Get-ChildItem release/*.apk -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
            "version=$version tag=$tag files=$($files -join ', ')" | Out-File -FilePath release.log -Append
            gh release create $tag --title $tag --notes "自动构建（GitHub Actions）" --latest @files *>> release.log
            $code = $LASTEXITCODE
          } catch {
            "ERROR: $_" | Out-File -FilePath release.log -Append
            $code = 1
          }
          Get-Content release.log -Tail 30
          exit $code

      # 失败时把各步骤日志提交回 ci-logs 分支：本机访问不了 GitHub 的日志接口，
      # 但 raw.githubusercontent.com 经过加速前缀是能读的。
      - name: 失败诊断（提交日志到仓库）
        if: failure()
        shell: pwsh
        run: |
          $out = @()
          $out += "run: $env:GITHUB_RUN_ID"
          $out += "node: $(node -v)  pnpm: $(pnpm -v)"
          foreach ($f in @('install.log','electron.log','build.log','manifest.log','android.log','android-sync.log','release.log')) {
            $out += "===== $f ====="
            if (Test-Path $f) { $out += (Get-Content $f -Tail 80) } else { $out += "(不存在)" }
          }
          $out += "===== 磁盘 ====="
          if (Test-Path release) { $out += (Get-ChildItem release | Select-Object Name,Length | Format-Table | Out-String) }
          $out | Out-File -FilePath ci-failure.log -Encoding utf8
          git config user.name "ci-bot"
          git config user.email "ci-bot@local"
          git add -f ci-failure.log
          git commit -m "ci: 记录失败日志" 2>$null
          git push -f origin HEAD:refs/heads/ci-logs
