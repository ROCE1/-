appId: com.example.dshapp
productName: DSH App
copyright: Copyright © 2026
# 直接用 node_modules 里已解压好的 Electron 运行时，避免打包时再去下载 zip
# （这台机器访问 GitHub 的 release 资产会超时，实测每次卡在这里）。
electronDist: node_modules/electron/dist
# store = 不做二次压缩：安装包大一些（约 360 MB），但打包更快、内存峰值低得多。
# GitHub runner 上 NSIS 的 solid 压缩曾在打包阶段被系统杀掉（日志无报错直接断），
# 换成 store 先保证能稳定出包；要压体积再单独优化。
compression: store
directories:
  # 先落在工作区（这里能写），构建完再复制到 D:\DSH-App-dist 分发
  output: release
  buildResources: build
files:
  - electron/**/*
  - www/**/*
  - app.config.json
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # 不能带空格：GitHub 上传资产时会把空格替换成点，
  # 而 latest.yml 里记录的是原始文件名，两边就对不上了（0.1.2 踩过）。
  artifactName: DSH-App-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DSH App
